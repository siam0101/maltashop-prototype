name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/maltashop

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, notification-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements-dev.txt
      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: pip install -r requirements-dev.txt
      - name: Run unit, component and contract tests
        working-directory: ${{ matrix.service }}
        run: python -m pytest -v

  build:
    name: Build image ${{ matrix.service }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, notification-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image tagged with commit SHA
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}

  smoke-test:
    name: Integration smoke test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create env file
        run: cp .env.example .env
      - name: Start the full system
        run: docker compose up -d --build --wait
      - name: Place an order and check the notification arrives
        run: |
          curl -sf -X POST http://localhost:8000/orders \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: ci-smoke-1" \
            -H "X-Correlation-ID: ci-smoke-correlation" \
            -d '{"customer_id":"cust-ci","product_id":"prod-1","quantity":1,"unit_price":10}'
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8001/notifications | grep -q "ci-smoke-correlation"; then
              echo "Notification received"
              exit 0
            fi
            sleep 2
          done
          echo "Notification not received"
          exit 1
      - name: Show logs
        if: always()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v